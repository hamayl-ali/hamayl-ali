name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:       # manual trigger button in Actions tab
  push:
    branches:
      - main               # optional: regenerate on every push to main

permissions:
  contents: write

concurrency:
  group: snake-generation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution snake(s)
        uses: Platane/snk@v3
        with:
          github_user_name: hamayl-ali
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=#00d4ff&color_dots=#0d1117,#0e4429,#006d32,#26a641,#39d353
            dist/sunset.gif?color_snake=#ff6b6b&color_dots=#0d1117,#3d0e40,#a4133c,#ff4d6d,#ffb703
            dist/neon.gif?color_snake=#ff00ff&color_dots=#161b22,#1f6feb,#6e40c9,#d946ef,#ff00ff
            dist/grid.svg?color_snake=#39d353&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
